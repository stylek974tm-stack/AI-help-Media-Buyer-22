<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: Tahoma, Arial, sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
      color: #e2e8f0;
    }
    .card {
      background: #1e293b;
      border-radius: 16px;
      padding: 32px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.4);
    }
    h1 { text-align: center; font-size: 22px; margin-bottom: 4px; color: #38bdf8; }
    .subtitle { text-align: center; color: #94a3b8; margin-bottom: 24px; font-size: 13px; }
    .tabs { display: flex; margin-bottom: 20px; border-radius: 10px; overflow: hidden; background: #0f172a; }
    .tab { flex: 1; padding: 10px; text-align: center; cursor: pointer; color: #94a3b8; font-size: 14px; }
    .tab.active { background: #38bdf8; color: #0f172a; font-weight: bold; }
    label { display: block; margin-bottom: 6px; font-size: 13px; color: #cbd5e1; }
    input {
      width: 100%; padding: 10px 12px; margin-bottom: 14px; border-radius: 8px;
      border: 1px solid #334155; background: #0f172a; color: #e2e8f0; font-size: 14px;
    }
    input:focus { outline: none; border-color: #38bdf8; }
    button.submit {
      width: 100%; padding: 12px; border: none; border-radius: 8px; background: #38bdf8;
      color: #0f172a; font-weight: bold; font-size: 15px; cursor: pointer; margin-top: 6px;
    }
    button.submit:disabled { opacity: 0.6; cursor: not-allowed; }
    .msg { text-align: center; font-size: 13px; margin-bottom: 12px; min-height: 16px; }
    .msg.error { color: #f87171; }
    .msg.success { color: #4ade80; }
    .hidden { display: none; }
    .dashboard { text-align: center; }
    .dashboard h2 { color: #38bdf8; }
    .dashboard p { color: #cbd5e1; margin: 4px 0; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Media Buyer Hub</h1>
    <div class="subtitle">منصة إدارة حساباتك بسهولة</div>

    <div id="authBox">
      <div class="tabs">
        <div class="tab active" id="tabLogin" onclick="showTab('login')">تسجيل الدخول</div>
        <div class="tab" id="tabSignup" onclick="showTab('signup')">حساب جديد</div>
      </div>

      <div id="msgBox" class="msg"></div>

      <form id="loginForm">
        <label>الإيميل</label>
        <input type="email" id="loginEmail" required>
        <label>كلمة السر</label>
        <input type="password" id="loginPassword" required>
        <button type="submit" class="submit" id="loginBtn">دخول</button>
      </form>

      <form id="signupForm" class="hidden">
        <label>الاسم *</label>
        <input type="text" id="suName" required>
        <label>رقم الهاتف *</label>
        <input type="tel" id="suPhone" required>
        <label>الإيميل *</label>
        <input type="email" id="suEmail" required>
        <label>اسم المتجر *</label>
        <input type="text" id="suStoreName" required>
        <label>لينك المتجر (اختياري)</label>
        <input type="url" id="suStoreLink">
        <label>كلمة السر (8 أحرف على الأقل) *</label>
        <input type="password" id="suPassword" required>
        <label>تأكيد كلمة السر *</label>
        <input type="password" id="suConfirmPassword" required>
        <button type="submit" class="submit" id="signupBtn">إنشاء الحساب</button>
      </form>
    </div>

    <div id="dashboard" class="dashboard hidden">
      <h2>أهلاً بيك 👋</h2>
      <p id="dbName"></p>
      <p id="dbStore"></p>
      <p id="dbEmail"></p>
    </div>
  </div>

  <script>
    function showTab(tab) {
      document.getElementById('msgBox').textContent = '';
      document.getElementById('loginForm').classList.toggle('hidden', tab !== 'login');
      document.getElementById('signupForm').classList.toggle('hidden', tab !== 'signup');
      document.getElementById('tabLogin').classList.toggle('active', tab === 'login');
      document.getElementById('tabSignup').classList.toggle('active', tab === 'signup');
    }

    function showMsg(text, type) {
      const box = document.getElementById('msgBox');
      box.textContent = text;
      box.className = 'msg ' + (type || '');
    }

    document.getElementById('loginForm').addEventListener('submit', function (e) {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      btn.disabled = true;
      showMsg('جاري التحقق...', '');

      google.script.run
        .withSuccessHandler(function (res) {
          btn.disabled = false;
          if (res.success) {
            showDashboard(res.user);
          } else {
            showMsg(res.message, 'error');
          }
        })
        .withFailureHandler(function (err) {
          btn.disabled = false;
          showMsg('حصل خطأ: ' + err.message, 'error');
        })
        .loginUser({
          email: document.getElementById('loginEmail').value,
          password: document.getElementById('loginPassword').value
        });
    });

    document.getElementById('signupForm').addEventListener('submit', function (e) {
      e.preventDefault();
      const password = document.getElementById('suPassword').value;
      const confirmPassword = document.getElementById('suConfirmPassword').value;

      if (password !== confirmPassword) {
        showMsg('كلمة السر وتأكيدها مش متطابقين', 'error');
        return;
      }
      if (password.length < 8) {
        showMsg('كلمة السر لازم تكون 8 أحرف على الأقل', 'error');
        return;
      }

      const btn = document.getElementById('signupBtn');
      btn.disabled = true;
      showMsg('جاري إنشاء الحساب...', '');

      google.script.run
        .withSuccessHandler(function (res) {
          btn.disabled = false;
          if (res.success) {
            showMsg(res.message, 'success');
            document.getElementById('signupForm').reset();
            setTimeout(function () { showTab('login'); }, 1200);
          } else {
            showMsg(res.message, 'error');
          }
        })
        .withFailureHandler(function (err) {
          btn.disabled = false;
          showMsg('حصل خطأ: ' + err.message, 'error');
        })
        .signUp({
          name: document.getElementById('suName').value,
          phone: document.getElementById('suPhone').value,
          email: document.getElementById('suEmail').value,
          storeName: document.getElementById('suStoreName').value,
          storeLink: document.getElementById('suStoreLink').value,
          password: password,
          confirmPassword: confirmPassword
        });
    });

    function showDashboard(user) {
      document.getElementById('authBox').classList.add('hidden');
      document.getElementById('dashboard').classList.remove('hidden');
      document.getElementById('dbName').textContent = 'الاسم: ' + user.name;
      document.getElementById('dbStore').textContent = 'المتجر: ' + user.storeName;
      document.getElementById('dbEmail').textContent = 'الإيميل: ' + user.email;
    }
  </script>
</body>
</html>
