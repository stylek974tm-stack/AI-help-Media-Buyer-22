<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090b0f">
<title>التحليلات — Media Buyer Hub</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
 --bg:#090b0f;--bg-soft:#0d1016;--surface:#12151c;--surface2:#171b24;--surface3:#1c2029;
 --border:#20242e;--border-soft:#191c24;--text:#eef1f6;--muted:#98a2b3;--faint:#5c6474;
 --accent:#4f7dfb;--accent2:#22d3ee;--accent-soft:rgba(79,125,251,.14);
 --good:#22c55e;--warn:#eab308;--bad:#ef4444;
 --safe-top:env(safe-area-inset-top);--safe-bottom:env(safe-area-inset-bottom);
}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:Cairo,system-ui,sans-serif}
body{padding-top:var(--safe-top);padding-bottom:calc(84px + var(--safe-bottom))}
button,input,select{font:inherit}a{text-decoration:none;color:inherit}
.app{width:min(1180px,100%);margin:auto;padding:16px 13px 30px}
.head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}
h1{font-size:23px;margin:0;font-weight:800}.sub{font-size:11px;color:var(--muted);margin-top:4px}
.status{font-size:11px;color:var(--muted);min-height:18px}.status.error{color:var(--bad)}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:9px;background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:12px;margin-bottom:14px}
.field{display:flex;flex-direction:column;gap:5px}.field label{font-size:10px;color:var(--muted);font-weight:700}
.field select,.field input{width:100%;height:42px;background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:12px;padding:0 10px;outline:none}
.field select:focus,.field input:focus{border-color:var(--accent)}
.range-wide{grid-column:1/-1}
.custom{display:none}.custom.show{display:flex}
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-bottom:14px}
.metric{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:12px}.metric .l{font-size:10px;color:var(--muted)}.metric .v{font:800 18px "JetBrains Mono",monospace;margin-top:5px}
.chart-grid{display:grid;grid-template-columns:1fr;gap:12px}
.chart-card{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:13px}
.chart-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}.chart-title{font-size:13px;font-weight:800}.chart-note{font-size:10px;color:var(--muted)}
.canvas-wrap{height:230px;position:relative}.empty{height:100%;display:grid;place-items:center;color:var(--muted);font-size:11px}
.bottom{position:fixed;z-index:30;left:8px;right:8px;bottom:calc(8px + var(--safe-bottom));background:rgba(13,16,22,.94);backdrop-filter:blur(18px);border:1px solid var(--border);border-radius:20px;padding:6px}
.nav{display:grid;grid-template-columns:repeat(4,1fr);gap:3px}.nav a{min-height:54px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#7d8797;font-size:9px;font-weight:700}.nav a.active{background:var(--surface2);color:var(--text)}.nav svg{width:20px;height:20px}.nav a.active svg{color:var(--accent2)}
.lang-en{direction:ltr}
@media(min-width:720px){.app{padding:28px}.filters{grid-template-columns:repeat(4,1fr)}.range-wide{grid-column:auto}.cards{grid-template-columns:repeat(4,1fr)}.chart-grid{grid-template-columns:1fr 1fr}.canvas-wrap{height:270px}.bottom{width:min(760px,calc(100% - 40px));left:50%;right:auto;transform:translateX(-50%)}}
</style>
</head>
<body>
<main class="app">
 <header class="head">
  <div><h1 id="title">التحليلات</h1><div class="sub" id="subtitle">متابعة الأداء عبر الفترة والحساب المحددين</div></div>
 </header>
 <div class="status" id="status"></div>

 <section class="filters">
  <div class="field range-wide"><label id="rangeLabel">الفترة</label>
   <select id="range">
    <option value="today">اليوم</option><option value="yesterday">أمس</option>
    <option value="7">آخر 7 أيام</option><option value="14">آخر 14 يوم</option>
    <option value="30">آخر 30 يوم</option><option value="90">آخر 3 شهور</option>
    <option value="365">آخر سنة</option><option value="custom">مخصص</option>
   </select>
  </div>
  <div class="field custom" id="fromWrap"><label id="fromLabel">من</label><input type="date" id="from"></div>
  <div class="field custom" id="toWrap"><label id="toLabel">إلى</label><input type="date" id="to"></div>
  <div class="field"><label id="platformLabel">المنصة</label><select id="platform"><option value="facebook">Meta / Facebook</option><option value="all">الكل</option></select></div>
  <div class="field"><label id="accountLabel">الحساب</label><select id="account"><option value="all">كل الحسابات</option></select></div>
 </section>

 <section class="cards">
  <div class="metric"><div class="l" id="spendL">الإنفاق</div><div class="v" id="spendV">—</div></div>
  <div class="metric"><div class="l" id="revenueL">الإيراد</div><div class="v" id="revenueV">—</div></div>
  <div class="metric"><div class="l" id="clicksL">النقرات</div><div class="v" id="clicksV">—</div></div>
  <div class="metric"><div class="l" id="purchasesL">المشتريات</div><div class="v" id="purchasesV">—</div></div>
 </section>

 <section class="chart-grid">
  <div class="chart-card"><div class="chart-head"><span class="chart-title" id="c1t">الإنفاق والإيراد</span><span class="chart-note" id="c1n">يوميًا</span></div><div class="canvas-wrap"><canvas id="chartSpend"></canvas></div></div>
  <div class="chart-card"><div class="chart-head"><span class="chart-title" id="c2t">النقرات و CTR</span><span class="chart-note">يوميًا</span></div><div class="canvas-wrap"><canvas id="chartClicks"></canvas></div></div>
  <div class="chart-card"><div class="chart-head"><span class="chart-title" id="c3t">CPM و CPC</span><span class="chart-note">يوميًا</span></div><div class="canvas-wrap"><canvas id="chartCost"></canvas></div></div>
  <div class="chart-card"><div class="chart-head"><span class="chart-title" id="c4t">المشتريات</span><span class="chart-note">يوميًا</span></div><div class="canvas-wrap"><canvas id="chartPurchases"></canvas></div></div>
 </section>
</main>

<nav class="bottom" aria-label="التنقل الرئيسي">
 <div class="nav">
  <a href="dashboard.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg><span id="navHome">الرئيسية</span></a>
  <a href="automation-rules.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M5.6 5.6l2.8 2.8M15.6 15.6l2.8 2.8M18.4 5.6l-2.8 2.8M8.4 15.6l-2.8 2.8"/><circle cx="12" cy="12" r="4"/></svg><span id="navAuto">الأتمتة</span></a>
  <a href="insights.html" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19V5M4 19h16"/><path d="M7 15l3-4 3 2 5-6"/></svg><span id="navInsights">التحليلات</span></a>
  <a href="settings.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19 15l2 1-2 3-2-1a7 7 0 0 1-2 1l-.3 2h-3.4l-.3-2a7 7 0 0 1-2-1l-2 1-2-3 2-1a7 7 0 0 1 0-2l-2-1 2-3 2 1a7 7 0 0 1 2-1l.3-2h3.4l.3 2a7 7 0 0 1 2 1l2-1 2 3-2 1a7 7 0 0 1 0 2z"/></svg><span id="navSettings">الإعدادات</span></a>
 </div>
</nav>

<script>
const SUPABASE_URL='https://zphepebjpxrzpudncuas.supabase.co';
const SUPABASE_KEY='sb_publishable_tIG9XDZeHVZpZjz74e-dBA_ui5GIYw7';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const GRAPH='https://graph.facebook.com/v26.0';
let user=null,connections=[],charts={};
const $=id=>document.getElementById(id);
const lang=localStorage.getItem('mbh_lang')||'ar';
const dict={
 ar:{title:'التحليلات',subtitle:'متابعة الأداء عبر الفترة والحساب المحددين',range:'الفترة',from:'من',to:'إلى',platform:'المنصة',account:'الحساب',all:'الكل',allAccounts:'كل الحسابات',spend:'الإنفاق',revenue:'الإيراد',clicks:'النقرات',purchases:'المشتريات',daily:'يوميًا',c1:'الإنفاق والإيراد',c2:'النقرات و CTR',c3:'CPM و CPC',c4:'المشتريات',home:'الرئيسية',auto:'الأتمتة',insights:'التحليلات',settings:'الإعدادات',meta:'Meta / Facebook',today:'اليوم',yesterday:'أمس',d7:'آخر 7 أيام',d14:'آخر 14 يوم',d30:'آخر 30 يوم',d90:'آخر 3 شهور',d365:'آخر سنة',custom:'مخصص',loading:'جاري تحميل البيانات…',noData:'لا توجد بيانات للفترة المحددة',error:'تعذر تحميل البيانات: '},
 en:{title:'Insights',subtitle:'Track performance for the selected period and account',range:'Period',from:'From',to:'To',platform:'Platform',account:'Account',all:'All',allAccounts:'All accounts',spend:'Spend',revenue:'Revenue',clicks:'Clicks',purchases:'Purchases',daily:'Daily',c1:'Spend & Revenue',c2:'Clicks & CTR',c3:'CPM & CPC',c4:'Purchases',home:'Home',auto:'Automation',insights:'Insights',settings:'Settings',meta:'Meta / Facebook',today:'Today',yesterday:'Yesterday',d7:'Last 7 days',d14:'Last 14 days',d30:'Last 30 days',d90:'Last 3 months',d365:'Last year',custom:'Custom',loading:'Loading data…',noData:'No data for the selected period',error:'Could not load data: '}
}[lang==='en'?'en':'ar'];
function T(){for(const [id,key] of [['title','title'],['subtitle','subtitle'],['rangeLabel','range'],['fromLabel','from'],['toLabel','to'],['platformLabel','platform'],['accountLabel','account'],['spendL','spend'],['revenueL','revenue'],['clicksL','clicks'],['purchasesL','purchases'],['c1t','c1'],['c2t','c2'],['c3t','c3'],['c4t','c4'],['navHome','home'],['navAuto','auto'],['navInsights','insights'],['navSettings','settings']]) $(id).textContent=T[id]||dict[key];}
T();
function money(n){return new Intl.NumberFormat(lang==='en'?'en-US':'ar-EG',{maximumFractionDigits:2}).format(Number(n)||0)}
function setStatus(s,err=false){$('status').textContent=s||'';$('status').className='status'+(err?' error':'')}
function fmt(d){return d.toISOString().slice(0,10)}
function range(){
 const r=$('range').value, now=new Date();
 if(r==='today')return{since:fmt(now),until:fmt(now)};
 if(r==='yesterday'){const d=new Date(now-86400000);return{since:fmt(d),until:fmt(d)}}
 if(r==='custom')return{since:$('from').value,until:$('to').value};
 const days=+r; return{since:fmt(new Date(now.getTime()-(days-1)*86400000)),until:fmt(now)}
}
function actionValue(actions,keys){let s=0;(actions||[]).forEach(a=>{if(keys.includes(a.action_type))s+=Number(a.value||0)});return s}
async function graph(path,params){
 const q=new URLSearchParams(params);const res=await fetch(GRAPH+'/'+path+'?'+q);
 const j=await res.json();if(j.error)throw Error(j.error.message);return j;
}
async function loadConnections(){
 const {data,error}=await sb.from('ad_pixels').select('*').eq('user_id',user.id);
 if(error)throw error;connections=(data||[]).filter(x=>x.pixel_type==='facebook');
 $('account').innerHTML='<option value="all">'+dict.allAccounts+'</option>';
 connections.forEach(c=>{const o=document.createElement('option');o.value=c.id;o.textContent=(c.ad_account_id||'—');$('account').appendChild(o)})
}
async function fetchData(){
 setStatus(dict.loading);
 const rr=range(); if(!rr.since||!rr.until){setStatus(dict.error+'Invalid date range',true);return}
 const selected=$('account').value;
 const rows=[];
 const list=selected==='all'?connections:connections.filter(c=>c.id===selected);
 for(const c of list){
   if(!c.ad_account_id||!c.pixel_token)continue;
   const j=await graph('act_'+String(c.ad_account_id).replace(/^act_/,'')+'/insights',{
     access_token:c.pixel_token,fields:'date_start,date_stop,impressions,clicks,spend,ctr,cpc,cpm,actions,action_values',
     time_range:JSON.stringify({since:rr.since,until:rr.until}),time_increment:1,limit:500
   });
   (j.data||[]).forEach(x=>rows.push(x));
 }
 render(rows);setStatus('');
}
function aggregate(rows){
 const m={};
 for(const r of rows){
  const k=r.date_start||r.date_stop;if(!k)continue;
  if(!m[k])m[k]={spend:0,revenue:0,impressions:0,clicks:0,purchases:0};
  m[k].spend+=+r.spend||0;m[k].impressions+=+r.impressions||0;m[k].clicks+=+r.clicks||0;
  m[k].revenue+=actionValue(r.action_values||[],['purchase','omni_purchase','offsite_conversion.fb_pixel_purchase']);
  m[k].purchases+=actionValue(r.actions||[],['purchase','omni_purchase','offsite_conversion.fb_pixel_purchase']);
 }
 return Object.entries(m).sort((a,b)=>a[0].localeCompare(b[0])).map(([date,v])=>({...v,date,ctr:v.impressions?v.clicks/v.impressions*100:0,cpc:v.clicks?v.spend/v.clicks:0,cpm:v.impressions?v.spend/v.impressions*1000:0}))
}
function baseChart(id){if(charts[id])charts[id].destroy();const ctx=$(id).getContext('2d');return new Chart(ctx,{type:'line',data:{labels:[],datasets:[]},options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},plugins:{legend:{labels:{color:'#98a2b3',font:{family:'Cairo',size:10}}}},scales:{x:{ticks:{color:'#5c6474',font:{size:9}},grid:{color:'#191c24'}},y:{ticks:{color:'#5c6474',font:{size:9}},grid:{color:'#191c24'}}}}})}
function render(rows){
 const a=aggregate(rows),labels=a.map(x=>x.date);
 $('spendV').textContent=money(a.reduce((s,x)=>s+x.spend,0));
 $('revenueV').textContent=money(a.reduce((s,x)=>s+x.revenue,0));
 $('clicksV').textContent=money(a.reduce((s,x)=>s+x.clicks,0));
 $('purchasesV').textContent=money(a.reduce((s,x)=>s+x.purchases,0));
 if(!a.length){setStatus(dict.noData);return}
 charts.spend=baseChart('chartSpend');charts.spend.data={labels,datasets:[
  {label:dict.spend,data:a.map(x=>x.spend),borderColor:'#4f7dfb',backgroundColor:'rgba(79,125,251,.12)',tension:.3,fill:true},
  {label:dict.revenue,data:a.map(x=>x.revenue),borderColor:'#22d3ee',backgroundColor:'rgba(34,211,238,.08)',tension:.3,fill:true}]};charts.spend.update();
 charts.clicks=baseChart('chartClicks');charts.clicks.data={labels,datasets:[
  {label:dict.clicks,data:a.map(x=>x.clicks),borderColor:'#4f7dfb',tension:.3,yAxisID:'y'},
  {label:'CTR',data:a.map(x=>x.ctr),borderColor:'#22d3ee',tension:.3,yAxisID:'r'}]};
 charts.clicks.options.scales.r={position:'right',ticks:{color:'#5c6474'},grid:{drawOnChartArea:false}};charts.clicks.update();
 charts.cost=baseChart('chartCost');charts.cost.data={labels,datasets:[
  {label:'CPM',data:a.map(x=>x.cpm),borderColor:'#4f7dfb',tension:.3,yAxisID:'y'},
  {label:'CPC',data:a.map(x=>x.cpc),borderColor:'#22d3ee',tension:.3,yAxisID:'r'}]};
 charts.cost.options.scales.r={position:'right',ticks:{color:'#5c6474'},grid:{drawOnChartArea:false}};charts.cost.update();
 charts.purchases=baseChart('chartPurchases');charts.purchases.data={labels,datasets:[{label:dict.purchases,data:a.map(x=>x.purchases),borderColor:'#22d3ee',backgroundColor:'rgba(34,211,238,.12)',tension:.3,fill:true}]};charts.purchases.update();
}
$('range').onchange=()=>{const c=$('range').value==='custom';$('fromWrap').classList.toggle('show',c);$('toWrap').classList.toggle('show',c);if(!c)fetchData()};
$('from').onchange=fetchData;$('to').onchange=fetchData;$('account').onchange=fetchData;$('platform').onchange=fetchData;
(async()=>{
 try{
  const {data}=await sb.auth.getSession();if(!data.session){location.href='index.html';return}user=data.session.user;
  await loadConnections();await fetchData();
 }catch(e){setStatus(dict.error+(e.message||e),true)}
})();
</script>
</body>
</html>
