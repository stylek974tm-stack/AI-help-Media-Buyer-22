<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الاشتراك والدفع - Media Buyer Hub</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>

  :root{
    --bg:#090b0f; --bg-soft:#0d1016;
    --surface:#12151c; --surface-2:#171b24; --surface-3:#1c2029;
    --border:#20242e; --border-soft:#191c24;
    --text:#eef1f6; --text-dim:#98a2b3; --text-faint:#5c6474;
    --accent:#4f7dfb; --accent-2:#22d3ee; --accent-soft:rgba(79,125,251,.14);
    --good:#22c55e; --bad:#f43f5e; --mid:#eab308;
    --radius:16px; --radius-sm:10px;
    --font-ui:'Cairo',system-ui,sans-serif;
    --font-num:'JetBrains Mono','Cairo',monospace;
  }
  * { box-sizing: border-box; }
  body {
    font-family: var(--font-ui);
    background: var(--bg); color: var(--text); margin: 0;
  }

  .content { padding:30px 20px; display:flex; justify-content:center; }
  .wrap { width:100%; max-width:480px; }
  .top-status { text-align:center; font-size:13px; color:#f0c040; margin-bottom:14px; white-space:pre-wrap; }
  .top-status.error { color:#ff6a6a; }

  .plan-card {
    background:linear-gradient(160deg,#1b1e26,#14161d);
    border:1px solid #262a35; border-radius:18px; padding:24px; margin-bottom:16px;
    box-shadow:0 10px 30px rgba(0,0,0,.3);
  }
  .plan-card h1 { font-size:19px; margin:0 0 6px; text-align:center; }
  .plan-card .sub { font-size:12.5px; color:#8a90a0; text-align:center; margin:0 0 20px; }

  .status-banner { border-radius:14px; padding:16px; margin-bottom:18px; text-align:center; }
  .status-banner.active { background:rgba(46,204,113,.12); border:1px solid rgba(46,204,113,.4); }
  .status-banner.pending { background:rgba(240,192,64,.12); border:1px solid rgba(240,192,64,.4); }
  .status-banner.expired { background:rgba(255,106,106,.12); border:1px solid rgba(255,106,106,.4); }
  .status-banner .big { font-size:15px; font-weight:800; margin-bottom:6px; }
  .status-banner.active .big { color:#2ecc71; }
  .status-banner.pending .big { color:#f0c040; }
  .status-banner.expired .big { color:#ff6a6a; }
  .countdown { font-family:'JetBrains Mono',monospace; font-size:24px; font-weight:800; letter-spacing:1px; margin-top:6px; color:#fff; }
  .countdown-lbl { font-size:11px; color:#8a90a0; margin-top:4px; }

  .offer-box { border:1px solid #262a35; border-radius:14px; padding:18px; margin-bottom:14px; background:#10121a; position:relative; }
  .offer-box .tag { position:absolute; top:-10px; right:16px; background:#2ecc71; color:#0f1115; font-size:10.5px; font-weight:800; padding:3px 10px; border-radius:20px; }
  .offer-box h3 { margin:4px 0 6px; font-size:15px; }
  .offer-box .price { font-size:22px; font-weight:800; color:#fff; }
  .offer-box .price small { font-size:12px; color:#8a90a0; font-weight:600; }
  .egp-price { font-size:12.5px; color:#6ab3ff; margin-top:2px; font-family:'JetBrains Mono',monospace; }
  .offer-box p { font-size:12px; color:#9aa0ac; margin:8px 0 14px; line-height:1.7; }
  .offer-box.locked { opacity:.55; }

  button.primary {
    width:100%; padding:13px; background:#4da3ff; border:none; border-radius:10px;
    font-size:14.5px; font-weight:800; color:#0f1115; cursor:pointer; font-family:inherit;
    display:flex; align-items:center; justify-content:center; gap:8px;
  }
  button.primary.green { background:#2ecc71; }
  button.primary:disabled { opacity:.55; cursor:not-allowed; background:#3a3f4c; color:#8a90a0; }
  button.ghost {
    width:100%; padding:11px; background:transparent; border:1px solid #2a2d36; border-radius:10px;
    font-size:13px; color:#aaa; cursor:pointer; font-family:inherit; margin-top:10px;
  }
  .hint { font-size:11px; color:#666; margin-top:14px; text-align:center; line-height:1.7; }

  .status-banner.grace { background:rgba(240,192,64,.12); border:1px solid rgba(240,192,64,.4); }
  .status-banner.grace .big { color:#f0c040; }

  .pay-panel { border:1px solid #262a35; border-radius:14px; padding:18px; margin-top:14px; background:#0e1017; }
  .pay-panel h4 { margin:0 0 12px; font-size:14px; }
  .method-tabs { display:flex; gap:8px; margin-bottom:14px; }
  .method-tab { flex:1; text-align:center; padding:9px 4px; border-radius:9px; border:1px solid #2a2d36; font-size:12.5px; color:#aaa; cursor:pointer; }
  .method-tab.active { background:var(--accent-soft); border-color:#4f7dfb; color:#bcd0ff; font-weight:700; }
  .pay-number-box { display:flex; align-items:center; justify-content:space-between; background:#171b24; border:1px dashed #333a48; border-radius:10px; padding:12px 14px; margin-bottom:14px; }
  .pay-number-box .num { font-family:'JetBrains Mono',monospace; font-size:17px; font-weight:700; color:#6ab3ff; direction:ltr; }
  .copy-btn { background:#22242c; border:1px solid #333a48; color:#ddd; border-radius:8px; padding:6px 10px; font-size:11.5px; cursor:pointer; }
  .field-lbl { font-size:12px; color:#9aa0ac; margin:10px 0 6px; }
  input.pay-input {
    width:100%; padding:11px 12px; background:#171b24; border:1px solid #2a2d36; border-radius:9px;
    color:var(--text); font-size:13.5px; font-family:inherit;
  }
  .pay-msg { font-size:12.5px; margin-top:12px; text-align:center; line-height:1.7; }
  .pay-msg.ok { color:#2ecc71; }
  .pay-msg.err { color:#ff6a6a; }
  .pay-msg.info { color:#f0c040; }
  .spin { display:inline-block; width:14px; height:14px; border:2px solid rgba(0,0,0,.25); border-top-color:#0f1115; border-radius:50%; animation:spin .7s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }

  .topbar{
    position:sticky; top:0; z-index:120;
    display:flex; align-items:center; gap:12px;
    padding:12px clamp(14px,3vw,28px);
    background:rgba(9,11,15,.86); backdrop-filter:blur(10px);
    border-bottom:1px solid var(--border-soft);
  }
  .icon-btn{
    display:flex; align-items:center; justify-content:center;
    width:38px; height:38px; border-radius:11px; flex-shrink:0;
    background:var(--surface); border:1px solid var(--border); color:var(--text);
    cursor:pointer; transition:.15s; text-decoration:none;
  }
  .icon-btn:hover{ background:var(--surface-3); border-color:#2c313d; }
  .icon-btn svg{ width:19px; height:19px; }
  .brand{ font-weight:800; font-size:15px; letter-spacing:.2px; white-space:nowrap; color:var(--text); }
  .brand span{ color:var(--accent-2); }
  .topbar-spacer{ flex:1; }


  /* ===== Unified visual theme: no slider / no bottom navigation ===== */
  :root{
    --bg:#0b0d12;
    --bg-soft:#0f1218;
    --surface:#12161d;
    --surface-2:#171c24;
    --surface-3:#1d232d;
    --border:#252c37;
    --border-soft:#1b2029;
    --text:#f3f5f8;
    --text-dim:#9aa4b3;
    --text-faint:#687384;
    --accent:#6d7cff;
    --accent-2:#62d9ff;
    --accent-soft:rgba(109,124,255,.14);
    --good:#39d98a;
    --bad:#ff5c73;
    --mid:#f2c14e;
  }
  html{background:var(--bg);}
  body{
    min-height:100dvh;
    background:
      radial-gradient(circle at 50% -10%, rgba(98,217,255,.055), transparent 34%),
      var(--bg);
    color:var(--text);
    padding-top:env(safe-area-inset-top);
    padding-bottom:env(safe-area-inset-bottom);
  }
  .topbar{
    position:sticky;
    top:0;
    z-index:20;
    min-height:58px;
    padding:10px max(16px, env(safe-area-inset-left)) 10px max(16px, env(safe-area-inset-right));
    background:rgba(11,13,18,.88);
    border-bottom:1px solid var(--border-soft);
    backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);
  }
  .brand{font-size:16px;}
  .brand span{color:var(--accent-2);}
  .content{padding:22px 16px 34px;}
  .wrap{max-width:560px;}
  .plan-card{
    background:linear-gradient(180deg,rgba(23,28,36,.96),rgba(16,19,26,.98));
    border:1px solid var(--border);
    border-radius:20px;
    padding:22px;
    box-shadow:0 18px 50px rgba(0,0,0,.24);
  }
  .plan-card h1{font-size:20px;}
  .plan-card .sub{color:var(--text-dim);line-height:1.8;}
  .status-banner.active{background:rgba(57,217,138,.09);border-color:rgba(57,217,138,.28)}
  .status-banner.pending,.status-banner.grace{background:rgba(242,193,78,.09);border-color:rgba(242,193,78,.28)}
  .status-banner.expired{background:rgba(255,92,115,.09);border-color:rgba(255,92,115,.28)}
  .status-banner.active .big{color:var(--good)}
  .status-banner.pending .big,.status-banner.grace .big{color:var(--mid)}
  .status-banner.expired .big{color:var(--bad)}
  .countdown{color:var(--text);}
  .countdown-lbl,.hint{color:var(--text-faint);}
  .offer-box,.pay-panel{
    background:var(--bg-soft);
    border-color:var(--border);
  }
  .offer-box .tag{background:var(--good);color:#08110d;}
  .offer-box .price{color:var(--text)}
  .offer-box .price small,.offer-box p,.field-lbl{color:var(--text-dim)}
  .egp-price,.pay-number-box .num{color:var(--accent-2)}
  button.primary{
    background:var(--accent);
    color:#fff;
    box-shadow:0 8px 22px rgba(109,124,255,.18);
  }
  button.primary.green{background:var(--good);color:#07110c;box-shadow:none}
  button.primary:disabled{background:var(--surface-3);color:var(--text-faint)}
  button.ghost{border-color:var(--border);color:var(--text-dim)}
  .method-tab{border-color:var(--border);color:var(--text-dim)}
  .method-tab.active{background:var(--accent-soft);border-color:var(--accent);color:#cbd1ff}
  .pay-number-box,input.pay-input{background:var(--surface-2);border-color:var(--border)}
  input.pay-input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .copy-btn{background:var(--surface-3);border-color:var(--border);color:var(--text)}
  .pay-msg.ok{color:var(--good)}
  .pay-msg.err{color:var(--bad)}
  .pay-msg.info{color:var(--mid)}
  @media (min-width:800px){
    .content{padding-top:34px;padding-bottom:50px;}
    .plan-card{padding:28px;}
  }

</style>
</head>
<body>
<div class="topbar">
  <div class="brand">Media Buyer <span>Hub</span></div>
</div>

<div class="content">
  <div class="wrap">
    <div class="top-status" id="topStatus"></div>

    <div class="plan-card">
      <h1>الاشتراك والدفع</h1>
      <p class="sub">التجربة المجانية بتتفعل أوتوماتيك أول ما تعمل حساب — وتفعيل الباقة المدفوعة بيتم أوتوماتيك بعد التحقق من التحويل.</p>

      <div id="statusArea"></div>
      <div id="offersArea"></div>
      <div id="payArea"></div>

      <button class="ghost" onclick="contactSupport()">📞 تواصل مع الدعم على واتساب</button>
      <div class="hint">لو حصلت أي مشكلة في التفعيل الأوتوماتيك، تقدر تتواصل معانا هنا وهنراجعها يدويًا.</div>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://zphepebjpxrzpudncuas.supabase.co';
const SUPABASE_KEY = 'sb_publishable_tIG9XDZeHVZpZjz74e-dBA_ui5GIYw7';
const sbClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const ADMIN_WHATSAPP = '201108712091'; // رقم الدعم على واتساب - ثابت
const PAY_NUMBER = '01108712171';       // رقم التحويل (فوري / محفظة)
const SUBMIT_PAYMENT_FUNCTION = 'submit-payment';

// دي قيم افتراضية للعرض بس (لحد ما app_settings تتحمل من السيرفر)،
// المصدر الحقيقي دايمًا هو الباك إند مش الأرقام دي.
let SETTINGS = { trial_days: 14, grace_days: 2, discount_price_usd: 1, discount_months: 3, full_price_usd: 5 };

let CURRENT_USER = null;
let PROFILE = null;
let EGP_RATE = null;
let ACCOUNT_ID = null;
let SUBSCRIPTION = null; // بييجي من جدول subscriptions فقط — للعرض، مفيش أي تعديل عليه من الصفحة دي
let SELECTED_METHOD = 'wallet';
let SUBMITTING = false;

function setTopStatus(msg, isError){
  const el = document.getElementById('topStatus');
  el.textContent = msg || '';
  el.className = 'top-status' + (isError ? ' error' : '');
}

async function init(){
  try{
    const { data } = await sbClient.auth.getSession();
    if (!data.session){ window.location.href = 'index.html'; return; }
    CURRENT_USER = data.session.user;

    const { data: rows, error } = await sbClient.from('user_data').select('*').eq('id', CURRENT_USER.id).limit(1);
    if (error){ setTopStatus('تعذر تحميل بياناتك: ' + error.message, true); return; }
    PROFILE = (rows && rows[0]) || { id: CURRENT_USER.id, settings:{} };
    if (!PROFILE.settings) PROFILE.settings = {};

    // الاشتراك بيتقرأ من الباك إند فقط (جدول subscriptions عن طريق RLS) —
    // مفيش أي كتابة على status/plan/expires_at من الصفحة دي خالص.
    // التجربة المجانية بتتفعل أوتوماتيك من تريجر في الداتابيز أول ما الحساب
    // يتعمل، فمفيش زرار "فعّل الباقة المجانية" هنا خالص.
    const { data: accId, error: accErr } = await sbClient.rpc('get_my_account_id');
    if (accErr){ setTopStatus('تعذر تحميل الحساب: ' + accErr.message, true); return; }
    ACCOUNT_ID = accId;

    await Promise.all([loadSettings(), loadSubscription(), loadExchangeRate()]);
    render();
    setInterval(tick, 1000);
  } catch(err){
    setTopStatus('حصل خطأ: ' + err.message, true);
  }
}

async function loadSettings(){
  try{
    const { data, error } = await sbClient.from('app_settings').select('key,value');
    if (error || !data) return;
    data.forEach(r => { SETTINGS[r.key] = isNaN(r.value) ? r.value : Number(r.value); });
  } catch(e){ /* هنكمل بالقيم الافتراضية لو الجدول مش قريّ للعامة */ }
}

async function loadSubscription(){
  const { data, error } = await sbClient.from('subscriptions').select('*').eq('account_id', ACCOUNT_ID).limit(1);
  if (error){ setTopStatus('تعذر تحميل بيانات الاشتراك: ' + error.message, true); return; }
  SUBSCRIPTION = (data && data[0]) || null;
}

async function loadExchangeRate(){
  try{
    const res = await fetch('https://open.er-api.com/v6/latest/USD');
    const json = await res.json();
    if (json && json.rates && json.rates.EGP) EGP_RATE = json.rates.EGP;
  } catch(e){ EGP_RATE = null; }
}

function sub(){ return SUBSCRIPTION; }

function currentPriceUsd(){
  const used = (SUBSCRIPTION && SUBSCRIPTION.discount_months_used) || 0;
  return used < SETTINGS.discount_months ? SETTINGS.discount_price_usd : SETTINGS.full_price_usd;
}

function waLink(message){
  return `https://wa.me/${ADMIN_WHATSAPP}?text=${encodeURIComponent(message)}`;
}
function contactSupport(){
  const name = (PROFILE && PROFILE.full_name) || '';
  window.open(waLink(`مرحبا، أنا ${name} وعايز أتواصل بخصوص حسابي في Media Buyer Hub.`), '_blank');
}

function fmtEgp(usd){
  if (!EGP_RATE) return 'تعذر جلب سعر الصرف الحالي دلوقتي';
  return `≈ ${(usd*EGP_RATE).toFixed(2)} ج.م (حسب سعر الصرف دلوقتي: ${EGP_RATE.toFixed(2)})`;
}

function remainingParts(expiresAt){
  const diff = new Date(expiresAt).getTime() - Date.now();
  if (diff <= 0) return null;
  const d = Math.floor(diff/86400000);
  const h = Math.floor((diff%86400000)/3600000);
  const m = Math.floor((diff%3600000)/60000);
  const s = Math.floor((diff%60000)/1000);
  return { d,h,m,s };
}
function pad(n){ return n.toString().padStart(2,'0'); }

function tick(){
  const s = sub();
  const el = document.getElementById('countdownVal');
  if (!s || !el) return;
  const refDate = s.status === 'grace' ? s.grace_until : s.expires_at;
  if (!refDate || (s.status !== 'active' && s.status !== 'grace')) return;
  const parts = remainingParts(refDate);
  if (!parts){ loadSubscription().then(render); return; }
  el.textContent = `${parts.d} يوم ${pad(parts.h)}:${pad(parts.m)}:${pad(parts.s)}`;
}

function render(){
  const s = sub();
  const statusArea = document.getElementById('statusArea');
  const payArea = document.getElementById('payArea');
  const isActive = s && s.status === 'active' && s.expires_at && remainingParts(s.expires_at);
  const isGrace = s && s.status === 'grace' && s.grace_until && remainingParts(s.grace_until);
  const needsPayment = !s || s.status === 'expired' || isGrace || (isActive && s.plan === 'free_trial');

  // status banner
  if (isActive){
    const planLabel = s.plan === 'free_trial' ? 'التجربة المجانية' : `الباقة (${currentPriceUsd()}$/شهر)`;
    statusArea.innerHTML = `
      <div class="status-banner active">
        <div class="big">✅ ${planLabel} مفعّلة دلوقتي</div>
        <div class="countdown num" id="countdownVal">--</div>
        <div class="countdown-lbl">${s.plan === 'free_trial' ? 'الوقت المتبقي من التجربة المجانية' : 'الوقت المتبقي على الباقة'}</div>
      </div>`;
  } else if (isGrace){
    statusArea.innerHTML = `
      <div class="status-banner grace">
        <div class="big">⚠️ باقتك خلصت — قدامك فترة سماح بس</div>
        <div class="countdown num" id="countdownVal">--</div>
        <div class="countdown-lbl">لو الوقت ده خلص من غير ما تشحن، هيتقفل الوصول للبيانات (البيكسل) أوتوماتيك</div>
      </div>`;
  } else if (s && s.status === 'expired'){
    statusArea.innerHTML = `
      <div class="status-banner expired">
        <div class="big">⌛ باقتك انتهت والوصول للبيانات اتقفل</div>
        <div class="countdown-lbl">اشحن الباقة عشان يرجع البيكسل يشتغل تاني على طول</div>
      </div>`;
  } else if (s && s.status === 'pending'){
    statusArea.innerHTML = `
      <div class="status-banner pending">
        <div class="big">⏳ في دفعة قيد المراجعة اليدوية</div>
        <div class="countdown-lbl">هنتابع رقم الموبايل اللي حوّلت منه ونتأكد من التحويل، ولو اتأكد هتتفعل الباقة هنا أوتوماتيك من غير ما تعمل حاجة تانية.</div>
      </div>`;
  } else {
    statusArea.innerHTML = '';
  }

  // منطقة الدفع بتظهر لما محتاج يشحن (منتهي/فترة سماح/عنده تجربة مجانية نشطة عايز يشحن قبلها)
  payArea.innerHTML = needsPayment ? buildPayPanel() : '';
  if (needsPayment) wirePayPanel();
}

function buildPayPanel(){
  const price = currentPriceUsd();
  const isDiscount = price === SETTINGS.discount_price_usd;
  return `
    <div class="offer-box">
      ${isDiscount ? '<span class="tag">عرض أول ' + SETTINGS.discount_months + ' شهور</span>' : ''}
      <h3>🚀 شحن الباقة</h3>
      <div class="price">
        $${price}
        ${isDiscount ? `<small style="text-decoration:line-through;margin-right:6px;">$${SETTINGS.full_price_usd}</small>` : '<small>/ شهر</small>'}
      </div>
      <div class="egp-price">${fmtEgp(price)}</div>
      <p>${isDiscount ? `أول ${SETTINGS.discount_months} شهور بسعر مخفّض $${SETTINGS.discount_price_usd} بدل $${SETTINGS.full_price_usd}، وبعدين السعر العادي.` : 'شحن شهري بالسعر العادي.'}</p>
    </div>

    <div class="pay-panel">
      <h4>💳 حوّل واشحن دلوقتي</h4>
      <div class="method-tabs" id="methodTabs">
        <div class="method-tab" data-m="wallet">محفظة</div>
        <div class="method-tab" data-m="fawry">فوري</div>
      </div>
      <div class="pay-number-box">
        <span class="num" id="payNumber">${PAY_NUMBER}</span>
        <button class="copy-btn" onclick="copyPayNumber()">نسخ</button>
      </div>

      <div class="field-lbl">المبلغ اللي حوّلته (بالجنيه)</div>
      <input class="pay-input" id="amountInput" type="number" inputmode="decimal" placeholder="مثال: ${EGP_RATE ? (price*EGP_RATE).toFixed(0) : '50'}">

      <div class="field-lbl">رقم الموبايل اللي حوّلت منه (نفس رقم المحفظة/فوري بالظبط)</div>
      <input class="pay-input" id="refInput" type="tel" inputmode="numeric" maxlength="11" placeholder="01xxxxxxxxx" dir="ltr">
      <div class="hint" style="margin-top:6px; text-align:right;">بنستخدم الرقم ده في المراجعة اليدوية للتأكد إن التحويل فعلاً صادر من عندك — أسهل وأسرع بكتير من رقم عملية ممكن يتلخبط أو يتلفّق.</div>

      <button class="primary" id="submitPayBtn" style="margin-top:16px;" onclick="submitPayment()">✅ حفظ وتفعيل الباقة</button>
      <div class="pay-msg" id="payMsg"></div>

      <button class="primary green" id="quickActivateBtn" style="margin-top:10px;" onclick="quickActivateWhatsapp()">⚡ حوّلت بالفعل؟ كلم خدمة العملاء للتفعيل السريع</button>
      <div class="hint" style="margin-top:6px;">هيفتحلك واتساب على طول ومعاه بيانات التحويل اللي كتبتها فوق، عشان التفعيل يتم يدويًا في دقايق.</div>
    </div>
  `;
}

function wirePayPanel(){
  document.querySelectorAll('.method-tab').forEach(tab => {
    if (tab.dataset.m === SELECTED_METHOD) tab.classList.add('active');
    tab.onclick = () => { SELECTED_METHOD = tab.dataset.m; document.querySelectorAll('.method-tab').forEach(t=>t.classList.remove('active')); tab.classList.add('active'); };
  });
}

function copyPayNumber(){
  navigator.clipboard.writeText(PAY_NUMBER);
  const el = document.getElementById('payMsg');
  if (el){ el.className = 'pay-msg ok'; el.textContent = 'اتنسخ الرقم ✅'; }
}

function setPayMsg(msg, type){
  const el = document.getElementById('payMsg');
  if (!el) return;
  el.className = 'pay-msg ' + (type || '');
  el.textContent = msg;
}

function isValidEgyptPhone(v){
  return /^01[0125][0-9]{8}$/.test(v);
}

function quickActivateWhatsapp(){
  const amount = document.getElementById('amountInput') ? document.getElementById('amountInput').value.trim() : '';
  const phone = document.getElementById('refInput') ? document.getElementById('refInput').value.trim() : '';
  const name = (PROFILE && PROFILE.full_name) || '';
  const methodLabel = SELECTED_METHOD === 'fawry' ? 'فوري' : 'محفظة';
  const price = currentPriceUsd();
  const isDiscount = price === SETTINGS.discount_price_usd;
  const offerLine = isDiscount ? `تفعيل الباقة (عرض أول ${SETTINGS.discount_months} شهور بسعر $${SETTINGS.discount_price_usd})` : 'تفعيل الباقة';

  let msg = `مرحبا، أنا ${name || 'عميل'} وعايز تفعيل سريع.\n${offerLine}\nطريقة التحويل: ${methodLabel}`;
  if (amount) msg += `\nالمبلغ اللي حوّلته: ${amount} ج.م`;
  if (phone) msg += `\nرقم الموبايل اللي حوّلت منه: ${phone}`;

  window.open(waLink(msg), '_blank');
}

async function submitPayment(){
  if (SUBMITTING) return;
  const amount = Number(document.getElementById('amountInput').value);
  const phone = document.getElementById('refInput').value.trim();

  if (!amount || amount <= 0){ setPayMsg('اكتب المبلغ اللي حوّلته', 'err'); return; }
  if (!phone){ setPayMsg('اكتب رقم الموبايل اللي حوّلت منه', 'err'); return; }
  if (!isValidEgyptPhone(phone)){ setPayMsg('رقم الموبايل مش صحيح — لازم يبدأ بـ 010 أو 011 أو 012 أو 015 ويكون 11 رقم.', 'err'); return; }

  SUBMITTING = true;
  const btn = document.getElementById('submitPayBtn');
  btn.disabled = true;
  setPayMsg('جاري التحقق من الدفع… ثواني ⏳', 'info');

  try{
    const { data: sessionData } = await sbClient.auth.getSession();
    const res = await fetch(`${SUPABASE_URL}/functions/v1/${SUBMIT_PAYMENT_FUNCTION}`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${sessionData.session.access_token}`
      },
      body: JSON.stringify({ method: SELECTED_METHOD, transfer_ref: phone, sender_phone: phone, claimed_amount_egp: amount })
    });
    const json = await res.json();

    if (!res.ok){
      setPayMsg('حصل خطأ: ' + (json.error || res.statusText), 'err');
    } else if (json.status === 'approved'){
      setPayMsg('تم تفعيل الباقة أوتوماتيك 🎉', 'ok');
      await loadSubscription();
      render();
    } else {
      setPayMsg(json.message || 'استلمنا طلبك وهنراجعه يدويًا خلال وقت قصير.', 'info');
      if (json.whatsapp) window.open(json.whatsapp, '_blank');
      await loadSubscription();
      render();
    }
  } catch(err){
    setPayMsg('حصل خطأ: ' + err.message, 'err');
  } finally {
    SUBMITTING = false;
    if (document.getElementById('submitPayBtn')) document.getElementById('submitPayBtn').disabled = false;
  }
}

init();
</script>
