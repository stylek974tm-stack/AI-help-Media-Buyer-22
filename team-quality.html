<script>
/* ============================================================
   Real data only. Media Buyer + Creative scores are computed
   live from the Meta Graph API (same ad_pixels token flow as
   dashboard.html). Website + Mentor need their own data source
   connected before they can show a real score — see notes below.
   ============================================================ */
const SUPABASE_URL = 'https://zphepebjpxrzpudncuas.supabase.co';
const SUPABASE_KEY = 'sb_publishable_tIG9XDZeHVZpZjz74e-dBA_ui5GIYw7';
const sbClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

document.addEventListener('DOMContentLoaded', () => {
  const navAuthItem = document.getElementById('navAuthItem');
  if (navAuthItem) {
    navAuthItem.addEventListener('click', async (e) => {
      e.preventDefault();
      await sbClient.auth.signOut();
      window.location.href = 'index.html';
    });
  }
});

const GRAPH = 'https://graph.facebook.com/v26.0';

let CURRENT_USER = null;
let CONNECTIONS = [];
let RANGE_DAYS = 30;
let ACTIVE_ROLE = 'mediabuyer';
let MB_RESULTS = [];   // media buyer scored rows (per connected ad account)
let CR_RESULTS = [];   // creative scored rows (per ad)

function num(v){ const n = parseFloat(v); return isNaN(n) ? 0 : n; }
function pct(a,b){ return b > 0 ? (a/b)*100 : 0; }
function actionVal(actions, re){
  if (!Array.isArray(actions)) return 0;
  const f = actions.find(a => re.test(a.action_type));
  return f ? num(f.value) : 0;
}
let WEBSITE_FUNNEL = null; // إجمالي خطوات الفانل (كليكس -> عربة -> بدء دفع -> شراء) من بيانات الإعلانات نفسها
function setTopStatus(msg, isError){
  const el = document.getElementById('topStatus');
  el.textContent = msg || '';
  el.className = 'top-status' + (isError ? ' error' : '');
}

/* ---------------- تشخيص الموقع من بيانات فانل الإعلان نفسه (بدون ربط Google Analytics) ----------------
   المنطق: نقارن كل خطوة بالخطوة اللي قبلها (زيارة -> عربة -> بدء دفع -> شراء) ونلاقي
   الاختناق الحقيقي. النسب المرجعية دي معدلات استرشادية شائعة في التجارة الإلكترونية/الدفع عند
   الاستلام في مصر، مش أرقام مخترعة عشوائيًا، لكنها برضه تقريبية لحد ما يتوصل مصدر بيانات
   موقع حقيقي (Google Analytics/بيانات المتجر) يديك نفس الدقة اللي بتديها بيانات الإعلان. */
/* ---------------- تقييم الموقع من بيانات فانل الإعلان نفسه (بدون ربط Google Analytics) ----------------
   بنستخدم نفس نظام التقييم المستخدم في باقي الصفحة (rate/overallScore/bandOf) عشان الكارت يبقى
   متسق تمامًا مع كروت Media Buyer ومصمم الإعلان: درجة من 100، شارة ملونة، وچيبس لكل مؤشر.
   لو حساب الإعلان مش بيبعت أحداث "عربة تسوق/بدء دفع" لفيسبوك أصلاً (شائع عند تجار كتير)،
   بنتجاهل المؤشرين دول ونعتمد بس على معدل التحويل الكلي (زيارة -> شراء) بدل ما نطلع تشخيص غلط. */
function scoreWebsite(f){
  const visits = f.lpv > 0 ? f.lpv : f.clicks; // لو مفيش تتبع "زيارة صفحة" بنستخدم الكليكات كبديل
  const hasEnoughVisits = visits >= 20;
  const overallRate = visits > 0 ? pct(f.purchases, visits) : 0;
  const atcRate = visits > 0 ? pct(f.atc, visits) : 0;
  const checkoutRate = f.atc > 0 ? pct(f.checkout, f.atc) : 0;
  const purchaseRate = f.checkout > 0 ? pct(f.purchases, f.checkout) : 0;
  const tracksFunnelSteps = f.atc > 0 || f.checkout > 0; // هل البكسل بيتتبع خطوات السلة/الدفع أصلًا

  const ratings = [
    { key:'معدل التحويل الكلي', rating: hasEnoughVisits ? rate(overallRate, v=>v>=2, v=>v>=0.7) : 'na' }
  ];
  if (tracksFunnelSteps){
    ratings.push({ key:'زيارة → عربة', rating: hasEnoughVisits ? rate(atcRate, v=>v>=6, v=>v>=3) : 'na' });
    ratings.push({ key:'عربة → بدء دفع', rating: f.atc>=5 ? rate(checkoutRate, v=>v>=55, v=>v>=35) : 'na' });
    ratings.push({ key:'بدء دفع → شراء', rating: f.checkout>=5 ? rate(purchaseRate, v=>v>=45, v=>v>=25) : 'na' });
  }

  const score = overallScore(ratings);

  // تحديد أوضح اختناق فعليًا (بالترتيب: أول مرحلة لقيناها "ضعيف")
  let stageKey = 'ok', message, tip;
  const atcR = ratings.find(r=>r.key==='زيارة → عربة');
  const coR = ratings.find(r=>r.key==='عربة → بدء دفع');
  const puR = ratings.find(r=>r.key==='بدء دفع → شراء');

  if (!hasEnoughVisits){
    stageKey = 'none';
    message = 'مفيش زيارات كفاية في الفترة دي عشان نطلع تشخيص موثوق — وسّع الفترة الزمنية.';
    tip = 'جرب تكبير الفترة الزمنية من فلتر الأيام فوق.';
  } else if (!tracksFunnelSteps){
    stageKey = 'nofunnel';
    message = `الموقع مش بيبعت أحداث "إضافة للعربة" أو "بدء الدفع" لفيسبوك، فمش هنقدر نحدد الاختناق بالظبط. معدل التحويل الكلي من زيارة لشراء: ${overallRate.toFixed(1)}%.`;
    tip = 'لو ركّبت أحداث Add to Cart و Initiate Checkout في البكسل، هنقدر نوريك بالظبط المشكلة فين — في صفحة المنتج ولا صفحة الدفع.';
  } else if (atcR && atcR.rating === 'bad'){
    stageKey = 'landing';
    message = `نسبة اللي بيضيفوا للعربة من الزوار ضعيفة (${atcRate.toFixed(1)}%). المشكلة الأرجح في صفحة العرض/المنتج مش بتقنع الزائر.`;
    tip = 'راجع وضوح العرض، صور المنتج، السعر، وسرعة تحميل الصفحة.';
  } else if (coR && coR.rating === 'bad'){
    stageKey = 'cart';
    message = `كتير بيضيفوا للعربة (${atcRate.toFixed(1)}% من الزوار) بس نسبة قليلة بتكمل لبدء الدفع (${checkoutRate.toFixed(1)}%). فيه اختناق بين العربة وبدء الدفع.`;
    tip = 'راجع خطوات إتمام الطلب، مصاريف الشحن الظاهرة فجأة، أو تعقيد الفورم قبل الدفع.';
  } else if (puR && puR.rating === 'bad'){
    stageKey = 'checkout';
    message = `نسبة كويسة بتبدأ الدفع بس نسبة قليلة بتكمل الشراء فعليًا (${purchaseRate.toFixed(1)}%). المشكلة الأرجح في صفحة الدفع أو الشحن نفسها.`;
    tip = 'راجع وسائل الدفع المتاحة، أي خطأ تقني في صفحة الدفع، ووضوح تفاصيل الشحن والتوصيل.';
  } else {
    stageKey = 'ok';
    message = `الفانل شغال بشكل صحي (من زيارة لشراء: ${overallRate.toFixed(1)}%). مفيش اختناق واضح في الموقع من بيانات الإعلان الحالية.`;
    tip = 'استمر على نفس الأداء، وراقب أي تغيير مفاجئ في النسب دي بعد أي تعديل على الموقع.';
  }

  return { visits, atc:f.atc, checkout:f.checkout, purchases:f.purchases,
    atcRate, checkoutRate, purchaseRate, overallRate, tracksFunnelSteps,
    ratings, score, band: bandOf(score), stageKey, message, tip };
}

/* ---------------- كاش مشترك بين الداشبورد والرسوم البيانية وأداء الموظفين (نفس منطق dashboard.html) ---------------- */
const GCACHE_TTL_MS = 5 * 60 * 1000;
function gcacheKey(path, params){
  const p = { ...params }; delete p.access_token;
  return 'gcache:' + path + ':' + JSON.stringify(p);
}
async function gget(path, params){
  const key = gcacheKey(path, params);
  try{
    const raw = localStorage.getItem(key);
    if (raw){
      const cached = JSON.parse(raw);
      if (Date.now() - cached.t < GCACHE_TTL_MS) return cached.d;
    }
  } catch(e){ /* تجاهل أي خطأ قراءة كاش وكمل عادي */ }

  const p = new URLSearchParams(params);
  const res = await fetch(`${GRAPH}/${path}?${p.toString()}`);
  const json = await res.json();
  if (json.error) throw new Error(json.error.message);

  try{ localStorage.setItem(key, JSON.stringify({ t: Date.now(), d: json })); }
  catch(e){ /* لو الكاش امتلأ، تجاهل التخزين ومتوقفش الصفحة */ }

  return json;
}
function fmtDate(d){ return d.toISOString().slice(0,10); }
function rangeFor(days, offsetDays){
  const end = new Date(Date.now() - offsetDays*86400000);
  const start = new Date(end.getTime() - (days-1)*86400000);
  return { since: fmtDate(start), until: fmtDate(end) };
}

/* ---------------- Scoring helpers ---------------- */
// rating: 'good' | 'mid' | 'bad' | 'na'  -> numeric score for the overall gauge
const RATING_SCORE = { good:100, mid:60, bad:20 };
function rate(value, goodTest, midTest){
  if (value === null || value === undefined || isNaN(value)) return 'na';
  if (goodTest(value)) return 'good';
  if (midTest(value)) return 'mid';
  return 'bad';
}
function overallScore(ratings){
  const used = ratings.filter(r => r.rating !== 'na');
  if (used.length === 0) return null;
  const sum = used.reduce((s,r)=> s + RATING_SCORE[r.rating], 0);
  return Math.round(sum/used.length);
}
function bandOf(score){
  if (score === null) return 'na';
  if (score < 40) return 'bad';
  if (score < 70) return 'mid';
  return 'good';
}
function bandLabel(band){ return band==='good' ? 'ممتاز' : (band==='mid' ? 'متوسط' : (band==='bad' ? 'ضعيف' : 'لا يوجد بيانات كفاية')); }
function bandEmoji(band){ return band==='good' ? '🟢' : (band==='mid' ? '🟡' : (band==='bad' ? '🔴' : '⚪')); }

/* ---------------- Gauge (fuel-gauge style, 0-100) ---------------- */
function polar(cx,cy,r,angleDeg){
  const rad = (angleDeg) * Math.PI/180;
  return { x: cx + r*Math.cos(rad), y: cy - r*Math.sin(rad) };
}
function arcPath(cx,cy,r,a1,a2){
  const p1 = polar(cx,cy,r,a1), p2 = polar(cx,cy,r,a2);
  const largeArc = Math.abs(a1-a2) > 180 ? 1 : 0;
  return `M ${p1.x.toFixed(1)} ${p1.y.toFixed(1)} A ${r} ${r} 0 ${largeArc} 0 ${p2.x.toFixed(1)} ${p2.y.toFixed(1)}`;
}
function gaugeSvg(score){
  const cx=100, cy=100, r=82;
  const s = score === null ? 0 : score;
  // bands: 0-39 red, 40-69 yellow, 70-100 green, mapped over 180deg (180deg=score0 ... 0deg=score100)
  const angFor = v => 180 - (v/100)*180;
  const needleAngle = angFor(s);
  const needleTip = polar(cx,cy,r-16,needleAngle);
  return `
    <svg viewBox="0 0 200 118" xmlns="http://www.w3.org/2000/svg">
      <path d="${arcPath(cx,cy,r,180,angFor(39))}" fill="none" stroke="var(--bad)" stroke-width="14" stroke-linecap="round"/>
      <path d="${arcPath(cx,cy,r,angFor(40),angFor(69))}" fill="none" stroke="var(--mid)" stroke-width="14" stroke-linecap="round"/>
      <path d="${arcPath(cx,cy,r,angFor(70),0)}" fill="none" stroke="var(--good)" stroke-width="14" stroke-linecap="round"/>
      ${score===null ? '' : `<line x1="${cx}" y1="${cy}" x2="${needleTip.x.toFixed(1)}" y2="${needleTip.y.toFixed(1)}" stroke="#eef1f6" stroke-width="3" stroke-linecap="round"/><circle cx="${cx}" cy="${cy}" r="6" fill="#eef1f6"/>`}
    </svg>
  `;
}

async function loadAndScore(){
  setTopStatus('جاري حساب التقييم من بيانات حسابك الإعلاني...');
  const { data: pixels, error } = await sbClient.from('ad_pixels').select('*').eq('user_id', CURRENT_USER.id);
  if (error){ setTopStatus('تعذر تحميل الحسابات المتصلة: ' + error.message, true); MB_RESULTS=[]; CR_RESULTS=[]; renderRole(); return; }

  CONNECTIONS = (pixels || []).filter(c => c.pixel_type === 'facebook' && c.ad_account_id && c.pixel_token);
  if (CONNECTIONS.length === 0){
    setTopStatus('مفيش حساب Meta متصل — روح صفحة "ربط الحسابات الإعلانية" الأول.');
    MB_RESULTS=[]; CR_RESULTS=[]; renderRole(); return;
  }

  const cur = rangeFor(RANGE_DAYS, 0);
  const prev = rangeFor(RANGE_DAYS, RANGE_DAYS);

  MB_RESULTS = [];
  CR_RESULTS = [];
  let anyError = null;

  // account-level average mature CPA across everything (real, data-driven baseline — no invented target numbers)
  let mSpend=0, mPurchases=0;
  // تجميع خطوات الفانل من بيانات الإعلانات الحقيقية (كليكس -> زيارة صفحة -> عربة -> بدء دفع -> شراء)
  let fClicks=0, fLPV=0, fATC=0, fCheckout=0, fPurchases=0, fSpend=0;

  for (const conn of CONNECTIONS){
    const actId = conn.ad_account_id.startsWith('act_') ? conn.ad_account_id : 'act_' + conn.ad_account_id;
    const accountFields = 'impressions,clicks,spend,ctr,cpc,cpm,actions,action_values';
    try{
      const [curIns, prevIns] = await Promise.all([
        gget(`${actId}/insights`, { fields:accountFields, time_range:JSON.stringify(cur), limit:1, access_token:conn.pixel_token }),
        gget(`${actId}/insights`, { fields:accountFields, time_range:JSON.stringify(prev), limit:1, access_token:conn.pixel_token }).catch(()=>({data:[]}))
      ]);
      const c = (curIns.data||[])[0] || {};
      const p = (prevIns.data||[])[0] || {};
      const curScored = scoreMediaBuyer(c);
      const prevScored = scoreMediaBuyer(p);
      if (curScored.purchases > 0){ mSpend += curScored.spend; mPurchases += curScored.purchases; }

      fClicks += num(c.clicks);
      fLPV += actionVal(c.actions, /landing_page_view/i);
      fATC += actionVal(c.actions, /add_to_cart/i);
      fCheckout += actionVal(c.actions, /initiate[d]?_checkout/i);
      fPurchases += curScored.purchases; // نفس رقم المشتريات المحسوب أصلاً في scoreMediaBuyer (بدون عد مزدوج)
      fSpend += num(c.spend);

      MB_RESULTS.push({
        id: conn.id,
        name: conn.employee_name || conn.label || ('حساب ' + conn.ad_account_id),
        role: 'Media Buyer',
        current: curScored,
        prevScore: prevScored.score
      });
    } catch(err){
      anyError = `خطأ من فيسبوك في حساب ${conn.ad_account_id}: ${err.message}`;
      console.error(anyError);
    }

    // per-ad creative scoring for this account
    try{
      const adFields = 'id,name,adset_id,campaign_id,creative{name}';
      const adInsightFields = 'impressions,clicks,spend,ctr,cpc,actions,action_values,video_play_actions,video_p25_watched_actions';
      const [adsRes, adInsCur, adInsPrev] = await Promise.all([
        gget(`${actId}/ads`, { fields:adFields, limit:200, access_token:conn.pixel_token }),
        gget(`${actId}/insights`, { level:'ad', fields:'ad_id,'+adInsightFields, time_range:JSON.stringify(cur), limit:200, access_token:conn.pixel_token }),
        gget(`${actId}/insights`, { level:'ad', fields:'ad_id,'+adInsightFields, time_range:JSON.stringify(prev), limit:200, access_token:conn.pixel_token }).catch(()=>({data:[]}))
      ]);
      const curMap = {}; (adInsCur.data||[]).forEach(r=>curMap[r.ad_id]=r);
      const prevMap = {}; (adInsPrev.data||[]).forEach(r=>prevMap[r.ad_id]=r);
      (adsRes.data||[]).forEach(ad=>{
        const c = curMap[ad.id];
        if (!c || num(c.impressions) === 0) return; // skip ads with no real activity this period
        const curScored = scoreCreative(c);
        const prevScored = scoreCreative(prevMap[ad.id] || {});
        CR_RESULTS.push({
          id: ad.id,
          name: (ad.creative && ad.creative.name) || ad.name,
          role: 'مصمم الإعلان',
          current: curScored,
          prevScore: prevScored.score
        });
      });
    } catch(err){
      console.error('creative fetch error', err);
    }
  }

  const avgCPA = mPurchases > 0 ? (mSpend/mPurchases) : null;
  MB_RESULTS.forEach(r => attachCPARating(r.current, avgCPA));

  WEBSITE_FUNNEL = { clicks:fClicks, lpv:fLPV, atc:fATC, checkout:fCheckout, purchases:fPurchases, spend:fSpend };

  if (anyError) setTopStatus(anyError, true); else setTopStatus('');
  renderRole();
}

/* ---------------- Media Buyer scoring ---------------- */
function scoreMediaBuyer(ins){
  const impressions = num(ins.impressions), clicks = num(ins.clicks), spend = num(ins.spend);
  const ctr = num(ins.ctr) || pct(clicks, impressions);
  const cpc = num(ins.cpc) || (clicks>0 ? spend/clicks : 0);
  const cpm = num(ins.cpm) || (impressions>0 ? (spend/impressions)*1000 : 0);
  const purchases = actionVal(ins.actions, /purchase/i);
  const revenue = Array.isArray(ins.action_values) ? (ins.action_values.find(a=>/purchase/i.test(a.action_type))||{}).value || 0 : 0;
  const roas = spend>0 ? num(revenue)/spend : 0;
  const convRate = pct(purchases, clicks);
  const messages = actionVal(ins.actions, /messaging_conversation_started/i);
  const msgToPurchase = messages>0 ? pct(purchases, messages) : null;

  const ratings = [
    { key:'CTR', rating: impressions>0 ? rate(ctr, v=>v>=1.5, v=>v>=1.0) : 'na' },
    { key:'CPC', rating: clicks>0 ? rate(cpc, v=>v<=0.5, v=>v<=1.0) : 'na' },
    { key:'CPM', rating: impressions>0 ? rate(cpm, v=>v<=10, v=>v<=20) : 'na' },
    { key:'Purchases', rating: clicks>0 ? rate(purchases, v=>v>=Math.max(3,clicks*0.02), v=>v>=Math.max(1,clicks*0.005)) : 'na' },
    { key:'ROAS', rating: spend>0 ? rate(roas, v=>v>=3, v=>v>=1.5) : 'na' },
    { key:'Conversion Rate', rating: clicks>0 ? rate(convRate, v=>v>=3, v=>v>=1) : 'na' }
  ];
  if (msgToPurchase !== null) ratings.push({ key:'Message→Purchase', rating: rate(msgToPurchase, v=>v>=8, v=>v>=3) });

  const score = overallScore(ratings);
  return { impressions, clicks, spend, ctr, cpc, cpm, purchases, revenue:num(revenue), roas, convRate, messages, msgToPurchase, ratings, score, band: bandOf(score) };
}
function attachCPARating(scored, avgCPA){
  if (scored.purchases > 0 && avgCPA){
    const cpa = scored.spend / scored.purchases;
    const r = rate(cpa, v=>v<=avgCPA*0.85, v=>v<=avgCPA*1.2);
    scored.ratings.push({ key:'تكلفة الشراء', rating: r });
    scored.cpa = cpa;
  } else {
    scored.ratings.push({ key:'تكلفة الشراء', rating:'na' });
  }
  scored.score = overallScore(scored.ratings);
  scored.band = bandOf(scored.score);
}

/* ---------------- Creative scoring ---------------- */
function scoreCreative(ins){
  const impressions = num(ins.impressions), clicks = num(ins.clicks), spend = num(ins.spend);
  const ctr = num(ins.ctr) || pct(clicks, impressions);
  const cpc = num(ins.cpc) || (clicks>0 ? spend/clicks : 0);
  const purchases = actionVal(ins.actions, /purchase/i);
  const engagement = actionVal(ins.actions, /post_engagement|page_engagement/i);
  const videoPlays = Array.isArray(ins.video_play_actions) ? num(ins.video_play_actions[0]?.value) : 0;
  const videoP25 = Array.isArray(ins.video_p25_watched_actions) ? num(ins.video_p25_watched_actions[0]?.value) : 0;
  const thumbstop = impressions>0 && videoPlays>0 ? pct(videoPlays, impressions) : null;
  const hookRate = videoPlays>0 ? pct(videoP25, videoPlays) : null;
  const convRate = pct(purchases, clicks);
  const engagementRate = pct(engagement, impressions);
  const costPerResult = purchases>0 ? spend/purchases : (clicks>0 ? spend/clicks : null);

  const ratings = [
    { key:'CTR', rating: impressions>0 ? rate(ctr, v=>v>=1.5, v=>v>=1.0) : 'na' },
    { key:'CPC', rating: clicks>0 ? rate(cpc, v=>v<=0.5, v=>v<=1.0) : 'na' },
    { key:'Engagement', rating: impressions>0 ? rate(engagementRate, v=>v>=2, v=>v>=0.8) : 'na' },
    { key:'Conversion', rating: clicks>0 ? rate(convRate, v=>v>=3, v=>v>=1) : 'na' }
  ];
  if (thumbstop !== null) ratings.push({ key:'Thumbstop', rating: rate(thumbstop, v=>v>=25, v=>v>=12) });
  if (hookRate !== null) ratings.push({ key:'Hook Rate', rating: rate(hookRate, v=>v>=50, v=>v>=25) });

  const score = overallScore(ratings);
  return { impressions, clicks, spend, ctr, cpc, purchases, thumbstop, hookRate, convRate, engagementRate, costPerResult, ratings, score, band: bandOf(score) };
}

/* ---------------- Trend ---------------- */
function trendInfo(curScore, prevScore){
  if (curScore === null || prevScore === null) return { label:'—', cls:'flat', alert:null };
  if (prevScore === 0) return { label:'—', cls:'flat', alert:null };
  const pctChange = ((curScore-prevScore)/prevScore)*100;
  if (Math.abs(pctChange) < 5) return { label:'➡️ ثابت', cls:'flat', alert:null };
  if (pctChange > 0) return { label:`📈 يتحسن ${pctChange.toFixed(0)}%`, cls:'up', alert:null };
  const alert = Math.abs(pctChange) >= 15 ? `⚠️ الأداء تراجع ${Math.abs(pctChange).toFixed(0)}% عن الفترة اللي فاتت` : null;
  return { label:`📉 يتراجع ${Math.abs(pctChange).toFixed(0)}%`, cls:'down', alert };
}

          <div class="gauge-label ${d.band}">${bandLabel(d.band)}</div>
        </div>
        <div class="chips-grid">${chips}</div>
        <div class="note-line"><b>التشخيص:</b> ${d.message}<br>💡 ${d.tip}</div>
        <div class="note-line" style="opacity:.75">
          مبني على بيانات فانل الإعلان نفسه (كليكس/عربة/بدء دفع/شراء) — مش Google Analytics، فبيغطي زوار الإعلانات بس.
          لدقة أعلى (Bounce Rate و Page Load الفعليين)، اربط Google Analytics أو بيانات المتجر بنفس فكرة ربط التوكن.
        </div>
      </div>
    `;
    return;
  }
  if (ACTIVE_ROLE === 'mentor'){
    title.innerHTML = 'Mentor<div class="section-line"></div>';
    grid.innerHTML = `<div class="placeholder-box">
      مفيش نظام مهام متصل دلوقتي.<br>
      عشان تحسب <b>نسبة تنفيذ المهام</b> و <b>الالتزام</b> و <b>سرعة حل المشاكل</b> بأرقام حقيقية، محتاج جدول مهام/متابعة للفريق نربطه هنا.
    </div>`;
    return;
  }

  const rows = currentRows();
  title.innerHTML = (ACTIVE_ROLE === 'mediabuyer' ? 'Media Buyer' : 'مصمم الإعلان') + '<div class="section-line"></div>';

  if (rows.length === 0){
    grid.innerHTML = `<div class="placeholder-box">مفيش بيانات كفاية في الفترة دي.</div>`;
    return;
  }

  grid.innerHTML = rows.map(r=>{
    const c = r.current;
    const chips = c.ratings.map(rt => {
      let valueTxt = '—';
      if (rt.key==='CTR') valueTxt = c.ctr.toFixed(2)+'%';
      else if (rt.key==='CPC') valueTxt = '$'+c.cpc.toFixed(2);
      else if (rt.key==='CPM') valueTxt = '$'+c.cpm.toFixed(2);
      else if (rt.key==='Purchases') valueTxt = c.purchases.toFixed(0);
      else if (rt.key==='ROAS') valueTxt = c.roas.toFixed(2)+'x';
      else if (rt.key==='Conversion Rate' || rt.key==='Conversion') valueTxt = c.convRate.toFixed(2)+'%';
      else if (rt.key==='Message→Purchase') valueTxt = c.msgToPurchase.toFixed(1)+'%';
      else if (rt.key==='تكلفة الشراء') valueTxt = c.cpa ? '$'+c.cpa.toFixed(2) : 'N/A';
      else if (rt.key==='Engagement') valueTxt = c.engagementRate.toFixed(2)+'%';
      else if (rt.key==='Thumbstop') valueTxt = c.thumbstop.toFixed(1)+'%';
      else if (rt.key==='Hook Rate') valueTxt = c.hookRate.toFixed(1)+'%';
      if (rt.rating==='na') valueTxt = 'N/A';
      return chipHtml(rt.key, rt.rating, valueTxt);
    }).join('');

    return `
      <div class="emp-card">
        <div class="emp-head">
          <div>
            <div class="emp-name">${r.name}</div>
            <div class="emp-role">${r.role}</div>
          </div>
          <div class="emp-badge ${c.band}">${bandEmoji(c.band)} ${bandLabel(c.band)}</div>
        </div>
        <div class="gauge-wrap">
          ${gaugeSvg(c.score)}
          <div class="gauge-score num">${c.score===null?'—':c.score+'%'}</div>
          <div class="gauge-label ${c.band}">${bandLabel(c.band)}</div>
        </div>
        <div class="chips-grid">${chips}</div>
        <div class="note-line"><b>ملاحظة:</b> التقييم محسوب تلقائيًا من بيانات آخر ${RANGE_DAYS} يوم الحقيقية من فيسبوك، من غير أي رقم مُدخل يدويًا.</div>
      </div>
    `;
  }).join('');
}

init();
</script>

<script>
function openSidebar(){
  document.getElementById('sidebar').classList.add('open');
  document.getElementById('backdrop').classList.add('show');
}
function closeSidebar(){
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('backdrop').classList.remove('show');
}
function toggleSidebar(e){
  if (e) e.stopPropagation();
  document.getElementById('sidebar').classList.contains('open') ? closeSidebar() : openSidebar();
}
document.addEventListener('click', (e) => {
  const sb = document.getElementById('sidebar');
  if (sb && sb.classList.contains('open') && !sb.contains(e.target) && e.target.id !== 'menuBtn' && !e.target.closest('#menuBtn')) closeSidebar();
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeSidebar(); });
</script>
</body>
</html>
